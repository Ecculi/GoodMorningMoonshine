# Builds the game for the browser. From main it is also published on
# GitHub Pages: https://ecculi.github.io/GoodMorningMoonshine/
# Needs Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Other branches only check that the game builds.
name: Web build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and web export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Download Godot and web export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j templates.tpz "templates/web_nothreads_*" "templates/version.txt" -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm templates.tpz

      # Version = config/version in project.godot + the run number, and the
      # build time (Finnish time), into the game (shown at start).
      - name: Write version and build time
        run: |
          BASE=$(grep '^config/version=' project.godot | cut -d'"' -f2)
          VERSION="${BASE:-0.1}.${{ github.run_number }}"
          DATE=$(TZ=Europe/Helsinki date '+%-d.%-m.%Y %H:%M')
          {
            echo 'extends RefCounted'
            echo '## Written by the web build workflow.'
            echo "const VERSION := \"$VERSION\""
            echo "const BUILD_DATE := \"$DATE\""
            echo "const COMMIT := \"${GITHUB_SHA::7}\""
            echo ''
            echo 'static func text() -> String:'
            echo '	if BUILD_DATE == "":'
            echo '		return VERSION'
            echo '	return "v%s · %s" % [VERSION, BUILD_DATE]'
          } > scripts/build_info.gd
          cat scripts/build_info.gd

      # The export succeeds even with broken scripts, so run the game
      # headless for a moment and fail on any script error in the log.
      - name: Check scripts
        run: |
          ~/godot/godot --headless --path . --import > import.log 2>&1 || true
          timeout 60 ~/godot/godot --headless --path . --quit-after 600 > run.log 2>&1 || true
          cat run.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compile Error|ERROR: .*\.gd" import.log run.log; then
            echo "::error::GDScript errors found (see above)"
            exit 1
          fi

      # Release build: the debug tools are still there behind F1 -> F12.
      - name: Export
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --path . --import || true
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.wasm

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  # Publish only from main.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
